// Quantalithos core · common/v1/errors.proto
//
// 全平台错误码枚举 + 错误详情结构。
// 所有 RPC 错误通过 gRPC status + ErrorDetails 返回。
//
// 草案阶段:✅ 主要错误码已覆盖 6 域,随各服务实施可扩展。

syntax = "proto3";

package quantalithos.common.v1;

option go_package = "quantalithos/common/v1";

// ---------- 错误码枚举 ----------
//
// 命名约定:<DOMAIN>_<CATEGORY>_<SPECIFIC>
// 按域组织,避免碰撞。

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;

  // ===== 通用错误(跨域)=====
  ERROR_INVALID_ARGUMENT = 1;
  ERROR_NOT_FOUND = 2;
  ERROR_ALREADY_EXISTS = 3;
  ERROR_PERMISSION_DENIED = 4;
  ERROR_UNAUTHENTICATED = 5;
  ERROR_RESOURCE_EXHAUSTED = 6;
  ERROR_FAILED_PRECONDITION = 7;
  ERROR_ABORTED = 8;
  ERROR_OUT_OF_RANGE = 9;
  ERROR_UNIMPLEMENTED = 10;
  ERROR_INTERNAL = 11;
  ERROR_UNAVAILABLE = 12;
  ERROR_DEADLINE_EXCEEDED = 13;

  // ===== 通用语义错误 =====
  ERROR_VERSION_CONFLICT = 50;                // 乐观锁冲突
  ERROR_INVALID_STATE_TRANSITION = 51;
  ERROR_CYCLE_DETECTED = 52;                  // DAG 环检测
  ERROR_QUOTA_EXCEEDED = 53;
  ERROR_IDEMPOTENCY_KEY_CONFLICT = 54;

  // ===== identity 域(100-199)=====
  IDENTITY_MEMBER_NOT_FOUND = 100;
  IDENTITY_ROLE_NOT_FOUND = 101;
  IDENTITY_INVALID_LIFECYCLE_TRANSITION = 102;
  IDENTITY_ROLE_HAS_ACTIVE_MEMBERS = 103;     // retire Role 被阻止
  IDENTITY_HIRED_CANNOT_ASSIGN_PROJECT = 104; // INV-7
  IDENTITY_TOMBSTONED_SEMANTIC_MEMORY_NOT_MIGRATED = 105;
  IDENTITY_MISSING_CAPABILITY_EVIDENCE = 106;
  IDENTITY_ROLE_SPEC_SOURCE_DRIFT = 107;

  // ===== conversation 域(200-299)=====
  CONVERSATION_NOT_FOUND = 200;
  CONVERSATION_TURN_NOT_FOUND = 201;
  CONVERSATION_ARCHIVED = 202;
  CONVERSATION_LOCKED = 203;
  CONVERSATION_DUPLICATE_GROUP_FOR_PROJECT = 204; // INV-2
  CONVERSATION_INVALID_TURN_KIND_CONTENT = 205;
  CONVERSATION_PARTICIPANT_LIMIT_EXCEEDED = 206; // dm 两人硬约束
  CONVERSATION_TURN_IMMUTABLE = 207;          // INV-14

  // ===== work 域(300-399)=====
  WORK_PROJECT_NOT_FOUND = 300;
  WORK_WORKITEM_NOT_FOUND = 301;
  WORK_ITERATION_NOT_FOUND = 302;
  WORK_BACKLOG_NOT_FOUND = 303;
  WORK_DEPENDENCY_CYCLE = 304;
  WORK_WIP_LIMIT_EXCEEDED = 305;
  WORK_DUPLICATE_ACTIVE_PROJECT_MEMBER = 306; // INV-16
  WORK_GLOBAL_MEMBER_NOT_ACTIVE = 307;        // INV-17
  WORK_TOOL_SCOPE_EXCEEDS_ROLE_DEFAULT = 308;
  WORK_ARCHIVED_PROJECT_CANNOT_CREATE = 309;  // INV-13
  WORK_PROFILE_ID_IMMUTABLE = 310;            // INV-4
  WORK_MUST_HAVE_KICKOFF_GATE = 311;          // INV-9
  WORK_ITERATION_UNIQUE_ACTIVE_VIOLATION = 312; // INV-43
  WORK_DONE_REQUIRES_APPROVED_ARTIFACT = 313;  // INV-30
  WORK_BLOCKED_REQUIRES_BLOCKER_NOTE = 314;    // INV-31

  // ===== process 域(400-499)=====
  PROCESS_TEMPLATE_NOT_FOUND = 400;
  PROCESS_PROFILE_NOT_FOUND = 401;
  PROCESS_INSTANCE_NOT_FOUND = 402;
  PROCESS_ACTIVITY_NOT_FOUND = 403;
  PROCESS_TEMPLATE_SOURCE_DRIFT = 404;        // INV-7
  PROCESS_TAILORING_REMOVES_MANDATORY_GATE = 405; // INV-14
  PROCESS_PROFILE_ALREADY_ACTIVE_IMMUTABLE = 406; // INV-12
  PROCESS_INSTANCE_ALREADY_ACTIVE = 407;      // INV-19
  PROCESS_INVALID_BPMN_GRAPH = 408;           // INV-9
  PROCESS_CHECKPOINT_SAVE_FAILED = 409;       // INV-25
  PROCESS_INVALID_ACTIVITY_TRANSITION = 410;
  PROCESS_TOKEN_MERGE_TIMEOUT = 411;          // INV-43

  // ===== governance 域(500-599)=====
  GOVERNANCE_GATE_NOT_FOUND = 500;
  GOVERNANCE_POLICY_NOT_FOUND = 501;
  GOVERNANCE_CONTROL_NOT_FOUND = 502;
  GOVERNANCE_AIIA_NOT_FOUND = 503;
  GOVERNANCE_SOA_NOT_FOUND = 504;
  GOVERNANCE_NONCONFORMITY_NOT_FOUND = 505;

  GOVERNANCE_INCOMPLETE_SIX_SEGMENTS = 510;   // INV-4(六段式不完整)
  GOVERNANCE_INVALID_AUTONOMY_LEVEL = 511;    // INV-5 / INV-12
  GOVERNANCE_USER_REQUIRED = 512;             // INV-13
  GOVERNANCE_NO_REJECT_OPTION = 513;          // INV-14
  GOVERNANCE_POLICY_CONFLICTS_SHARED_RULES = 514; // INV-20
  GOVERNANCE_SOA_MUST_COVER_38_CONTROLS = 515; // INV-39
  GOVERNANCE_POLICY_SCHEMA_INVALID = 516;     // INV-25
  GOVERNANCE_GATE_EVIDENCE_INCOMPLETE = 517;
  GOVERNANCE_RESIDUAL_RISK_UNACCEPTABLE = 518; // INV-34

  // ===== artifact 域(600-699)=====
  ARTIFACT_NOT_FOUND = 600;
  ARTIFACT_BASELINE_NOT_FOUND = 601;
  ARTIFACT_APPROVED_IMMUTABLE = 602;          // INV-2
  ARTIFACT_LINEAGE_CYCLE = 603;               // INV-6 / INV-19 / INV-24
  ARTIFACT_MISSING_QUALITY_TAGS = 604;        // INV-13
  ARTIFACT_MISSING_CONSENT_EVIDENCE = 605;    // INV-25
  ARTIFACT_CONTENT_HASH_MISMATCH = 606;       // INV-15(审计严重)
  ARTIFACT_RELEASE_REQUIRES_CONTAINS_RELATION = 607;
  ARTIFACT_DATASET_REQUIRES_BIAS_EVALUATION = 608; // INV-27

  // ===== L2 Member 运行层(700-799)=====
  MEMBER_LAUNCH_TOKEN_INVALID = 700;
  MEMBER_CONTAINER_CRASHED = 701;
  MEMBER_HEARTBEAT_LOST = 702;
  MEMBER_GRACEFUL_SHUTDOWN_TIMEOUT = 703;
  MEMBER_ATTENTION_REJECTED_PROMPT_INJECTION = 704;
  MEMBER_TOOL_INVOKE_POLICY_DENIED = 705;
  MEMBER_CHECKPOINT_RESTORE_FAILED = 706;

  // ===== L3 方法能力层(800-899)=====
  METHOD_CONTENT_NOT_FOUND = 800;
  METHOD_CONTENT_VERSION_MISMATCH = 801;
  CAPABILITY_MCP_SERVER_NOT_IN_WHITELIST = 810;
  CAPABILITY_PROVIDER_CONTRACT_VIOLATION = 811;

  // ===== L4 基础设施(900-999)=====
  SANDBOX_ESCAPE_DETECTED = 900;              // 严重
  SANDBOX_RESOURCE_LIMIT = 901;
  OBSERVABILITY_AUDIT_CHAIN_BROKEN = 910;     // 严重
  ARCHIVE_INTEGRITY_CHECK_FAILED = 920;
}

// ---------- 错误详情 ----------

// ErrorDetails 通过 gRPC status details 附加到错误响应。
// 提供结构化信息便于客户端精确处理。
message ErrorDetails {
  ErrorCode code = 1;
  string message = 2;                         // human-readable
  string domain = 3;                          // "identity" / "work" / ...
  map<string, string> metadata = 4;           // 扩展键值对(如 violation_field / expected / actual)
  string violating_invariant = 5;             // 如 "INV-16"(便于定位文档)
  string hint = 6;                            // 客户端可操作的提示
  string trace_id = 7;
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistant 私聊 · Quantalithos AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif;background:#f0f0f0;height:100vh;}

.app{display:flex;height:100vh;}

/* 左侧导航 */
.nav{width:56px;background:#1a1a2e;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;flex-shrink:0;}
.ni{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:#8888aa;transition:all .15s;}
.ni:hover{background:#2d2d4a;color:#fff;}
.ni.on{background:#3d3d5c;color:#fff;}
.ni .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;background:#e53935;border-radius:50%;border:2px solid #1a1a2e;}
.nav-sp{flex:1;}
.nav-av{width:32px;height:32px;border-radius:50%;background:#1565c0;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;font-weight:600;}

/* 中间会话列表 */
.conv{width:260px;background:#fff;border-right:1px solid #e8e8e8;display:flex;flex-direction:column;flex-shrink:0;}
.conv-hd{padding:14px 16px;font-size:14px;font-weight:600;color:#333;border-bottom:1px solid #f0f0f0;}
.conv-items{flex:1;overflow-y:auto;}
.conv-lbl{padding:8px 16px 4px;font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.5px;}
.ci{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;transition:background .1s;}
.ci:hover{background:#f5f7fa;}
.ci.on{background:#e3f2fd;}
.ci-av{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0;}
.ci-info{flex:1;min-width:0;}
.ci-name{font-size:13px;font-weight:500;color:#333;}
.ci-pre{font-size:11px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* 主内容区 */
.main{flex:1;display:flex;flex-direction:column;background:#f5f7fa;}
.main-hd{padding:14px 20px;background:#fff;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;gap:10px;}
.main-hd h2{font-size:15px;font-weight:600;color:#333;}
.main-hd .sub{font-size:11px;color:#999;}

/* 消息区 */
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;}

/* 消息气泡 */
.msg{display:flex;gap:8px;max-width:80%;}
.msg.bot{align-self:flex-start;}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
.msg-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0;}
.msg-body{display:flex;flex-direction:column;gap:2px;}
.msg-name{font-size:10px;color:#999;}
.msg-text{padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6;color:#333;}
.msg.bot .msg-text{background:#fff;border:1px solid #e8e8e8;border-top-left-radius:4px;}
.msg.user .msg-text{background:#1565c0;color:#fff;border-top-right-radius:4px;}

/* 系统消息 */
.sys-msg{text-align:center;font-size:11px;color:#999;padding:4px 0;}

/* 表单卡片 */
.form-card{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:16px;max-width:400px;}
.form-card h3{font-size:13px;font-weight:600;margin-bottom:12px;color:#333;}
.form-row{margin-bottom:10px;}
.form-row label{display:block;font-size:11px;color:#666;margin-bottom:4px;}
.form-row input,.form-row textarea,.form-row select{width:100%;padding:8px 10px;border:1px solid #e0e0e0;border-radius:6px;font-size:12px;outline:none;font-family:inherit;}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{border-color:#1565c0;}
.form-row textarea{resize:vertical;min-height:60px;}
.form-btn{display:flex;gap:8px;margin-top:12px;}
.form-btn button{padding:6px 16px;border-radius:6px;font-size:12px;cursor:pointer;border:none;font-weight:500;}
.btn-primary{background:#1565c0;color:#fff;}
.btn-secondary{background:#f5f5f5;color:#666;}

/* 项目卡片 */
.project-card{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:16px;max-width:400px;border-left:4px solid #43a047;}
.project-card h3{font-size:13px;font-weight:600;margin-bottom:8px;color:#333;display:flex;align-items:center;gap:6px;}
.project-card .info{font-size:11px;color:#666;line-height:1.6;}
.project-card .team{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.team-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:500;background:#f5f5f5;color:#555;}
.team-badge .dot{width:6px;height:6px;border-radius:50%;}

/* 输入区 */
.input-area{padding:12px 20px;background:#fff;border-top:1px solid #e8e8e8;display:flex;gap:10px;align-items:flex-end;}
.input-area textarea{flex:1;padding:10px 14px;border:1px solid #e0e0e0;border-radius:10px;font-size:13px;resize:none;outline:none;font-family:inherit;min-height:40px;max-height:120px;}
.input-area textarea:focus{border-color:#1565c0;}
.send-btn{width:36px;height:36px;border-radius:50%;background:#1565c0;color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.send-btn:disabled{background:#ccc;cursor:not-allowed;}

/* 打字动画 */
.typing{display:flex;gap:4px;padding:10px 14px;}
.typing span{width:6px;height:6px;background:#999;border-radius:50%;animation:bounce .6s infinite alternate;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes bounce{to{transform:translateY(-6px);opacity:.3;}}

/* 快捷回复 */
.quick-replies{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 8px;}
.qr{padding:6px 12px;border-radius:16px;font-size:11px;cursor:pointer;border:1px solid #e0e0e0;background:#fff;color:#555;transition:all .15s;}
.qr:hover{border-color:#1565c0;color:#1565c0;background:#e3f2fd;}

/* 隐藏 */
.hidden{display:none !important;}
</style>
</head>
<body>
<div class="app">
  <!-- 左侧导航 -->
  <div class="nav">
    <div class="ni on" style="position:relative;">💬<div class="dot"></div></div>
    <div class="ni">📊</div>
    <div class="ni">📈</div>
    <div class="nav-sp"></div>
    <div class="nav-av">A</div>
  </div>

  <!-- 中间会话列表 -->
  <div class="conv">
    <div class="conv-hd">消息</div>
    <div class="conv-items">
      <div class="conv-lbl">置顶</div>
      <div class="ci on">
        <div class="ci-av" style="background:#7b1fa2;">🤖</div>
        <div class="ci-info">
          <div class="ci-name">Assistant</div>
          <div class="ci-pre">有什么可以帮你的？</div>
        </div>
      </div>
      <div class="conv-lbl">项目</div>
      <div class="ci">
        <div class="ci-av" style="background:#388e3c;border-radius:6px;font-size:10px;">博客</div>
        <div class="ci-info">
          <div class="ci-name">博客系统</div>
          <div class="ci-pre">TL: 任务拆解完成</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 主内容区 -->
  <div class="main">
    <div class="main-hd">
      <div class="ci-av" style="background:#7b1fa2;width:28px;height:28px;font-size:12px;">🤖</div>
      <div>
        <h2>Assistant</h2>
        <div class="sub">你的 AI 助手 · 随时可以发起新项目</div>
      </div>
    </div>

    <div class="messages" id="messages">
      <!-- 初始消息 -->
      <div class="msg bot">
        <div class="msg-av" style="background:#7b1fa2;">🤖</div>
        <div class="msg-body">
          <div class="msg-name">Assistant</div>
          <div class="msg-text">你好！我是你的 AI 助手。我可以帮你：<br><br>🚀 发起新项目<br>📋 查看项目进度<br>❓ 回答问题<br><br>有什么需要帮忙的吗？</div>
        </div>
      </div>
    </div>

    <div class="quick-replies" id="quickReplies">
      <div class="qr" onclick="sendQuick('我想做一个博客系统')">🚀 我想做一个博客系统</div>
      <div class="qr" onclick="sendQuick('查看当前项目进度')">📋 查看项目进度</div>
      <div class="qr" onclick="sendQuick('帮我解释一下 BPMN')">❓ 什么是 BPMN</div>
    </div>

    <div class="input-area">
      <textarea id="input" placeholder="输入消息..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
      <button class="send-btn" onclick="send()">↑</button>
    </div>
  </div>
</div>

<script>
const msgs = document.getElementById('messages');
const input = document.getElementById('input');
const qr = document.getElementById('quickReplies');

let step = 0; // 对话阶段

// 对话流程定义
const flow = [
  // step 0: 用户说想做项目 → Assistant 识别意图，开始收集信息
  {
    bot: `好的！我来帮你发起一个新项目。<br><br>先告诉我几个基本信息：`,
    form: 'project-form',
    delay: 800,
  },
  // step 1: 用户提交表单 → Assistant 确认信息
  {
    bot: null, // 动态生成
    delay: 600,
  },
  // step 2: 用户确认 → Assistant 创建项目 + 组建团队
  {
    bot: `正在创建项目...`,
    delay: 1500,
    after: 'create-project',
  },
  // step 3: 项目创建完成 → 显示项目卡片
  {
    bot: null,
    delay: 500,
    after: 'show-project',
  },
  // step 4: 团队组建 → 跳转提示
  {
    bot: `项目群聊已创建，Tech Lead 已加入。<br>你可以在左侧会话列表中看到新的项目群聊。<br><br>接下来 Tech Lead 会和你进行目标校准，确认项目方向。`,
    delay: 800,
  },
];

function addMsg(type, html) {
  const div = document.createElement('div');
  if (type === 'bot') {
    div.className = 'msg bot';
    div.innerHTML = `
      <div class="msg-av" style="background:#7b1fa2;">🤖</div>
      <div class="msg-body">
        <div class="msg-name">Assistant</div>
        <div class="msg-text">${html}</div>
      </div>`;
  } else if (type === 'user') {
    div.className = 'msg user';
    div.innerHTML = `
      <div class="msg-av" style="background:#1565c0;">A</div>
      <div class="msg-body">
        <div class="msg-text">${html}</div>
      </div>`;
  } else if (type === 'system') {
    div.className = 'sys-msg';
    div.textContent = html;
  } else if (type === 'html') {
    div.innerHTML = html;
  }
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typing';
  div.innerHTML = `
    <div class="msg-av" style="background:#7b1fa2;">🤖</div>
    <div class="msg-body">
      <div class="typing"><span></span><span></span><span></span></div>
    </div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function sendQuick(text) {
  qr.classList.add('hidden');
  addMsg('user', text);
  processStep();
}

function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  qr.classList.add('hidden');
  addMsg('user', text);
  processStep(text);
}

function processStep(userText) {
  if (step === 0) {
    // 用户说了想做什么 → 显示表单
    addTyping();
    setTimeout(() => {
      removeTyping();
      addMsg('bot', flow[0].bot);
      showProjectForm();
      step = 1;
    }, flow[0].delay);
  } else if (step === 2) {
    // 用户确认 → 创建项目
    addTyping();
    setTimeout(() => {
      removeTyping();
      addMsg('bot', flow[2].bot);
      addTyping();
      setTimeout(() => {
        removeTyping();
        showProjectCard();
        step = 4;
        setTimeout(() => {
          addMsg('bot', flow[4].bot);
          addNewConv();
        }, 1000);
      }, flow[2].delay);
    }, 600);
  }
}

function showProjectForm() {
  const html = `
    <div class="msg bot">
      <div class="msg-av" style="background:#7b1fa2;">🤖</div>
      <div class="msg-body">
        <div class="form-card" id="projectForm">
          <h3>📋 项目信息</h3>
          <div class="form-row">
            <label>项目名称</label>
            <input type="text" id="pName" value="博客系统" placeholder="例：博客系统">
          </div>
          <div class="form-row">
            <label>项目描述</label>
            <textarea id="pDesc" placeholder="简要描述项目目标">一个支持文章发布、评论、标签的个人博客系统</textarea>
          </div>
          <div class="form-row">
            <label>项目规模</label>
            <select id="pScale">
              <option value="small">小型（1-2 周）</option>
              <option value="medium" selected>中型（3-6 周）</option>
              <option value="large">大型（6+ 周）</option>
            </select>
          </div>
          <div class="form-row">
            <label>技术偏好（可选）</label>
            <input type="text" id="pTech" placeholder="例：Vue 3 + Rust" value="Vue 3 + Rust + PostgreSQL">
          </div>
          <div class="form-btn">
            <button class="btn-primary" onclick="submitForm()">提交</button>
            <button class="btn-secondary" onclick="cancelForm()">取消</button>
          </div>
        </div>
      </div>
    </div>`;
  addMsg('html', html);
}

function submitForm() {
  const name = document.getElementById('pName').value;
  const desc = document.getElementById('pDesc').value;
  const scale = document.getElementById('pScale').value;
  const tech = document.getElementById('pTech').value;

  // 禁用表单
  document.getElementById('projectForm').style.opacity = '0.6';
  document.getElementById('projectForm').style.pointerEvents = 'none';

  // 显示确认
  addTyping();
  setTimeout(() => {
    removeTyping();
    addMsg('bot', `收到！确认一下项目信息：<br><br>` +
      `📌 <b>${name}</b><br>` +
      `📝 ${desc}<br>` +
      `📏 规模：${scale === 'small' ? '小型' : scale === 'medium' ? '中型' : '大型'}<br>` +
      `🛠 技术栈：${tech || '由 TL 决定'}<br><br>` +
      `确认创建吗？`);

    // 显示确认按钮
    const btns = document.createElement('div');
    btns.className = 'quick-replies';
    btns.innerHTML = `
      <div class="qr" onclick="confirmProject()" style="border-color:#43a047;color:#2e7d32;background:#e8f5e9;">✅ 确认创建</div>
      <div class="qr" onclick="editProject()">✏️ 修改信息</div>`;
    msgs.appendChild(btns);
    msgs.scrollTop = msgs.scrollHeight;
    step = 2;
  }, 800);
}

function cancelForm() {
  document.getElementById('projectForm').closest('.msg').remove();
  addMsg('bot', '好的，取消了。有其他需要帮忙的吗？');
  step = 0;
}

function confirmProject() {
  // 移除确认按钮
  document.querySelector('.quick-replies:last-of-type')?.remove();
  addMsg('user', '确认创建');
  processStep();
}

function editProject() {
  document.querySelector('.quick-replies:last-of-type')?.remove();
  addMsg('user', '我想修改一下');
  addMsg('bot', '好的，请直接修改上面的表单，然后重新提交。');
  document.getElementById('projectForm').style.opacity = '1';
  document.getElementById('projectForm').style.pointerEvents = 'auto';
  step = 1;
}

function showProjectCard() {
  const html = `
    <div class="msg bot">
      <div class="msg-av" style="background:#7b1fa2;">🤖</div>
      <div class="msg-body">
        <div class="msg-text">项目创建成功！🎉</div>
        <div class="project-card" style="margin-top:8px;">
          <h3>🚀 博客系统 <span style="font-size:10px;background:#e8f5e9;color:#2e7d32;padding:2px 8px;border-radius:4px;font-weight:400;">进行中</span></h3>
          <div class="info">
            一个支持文章发布、评论、标签的个人博客系统<br>
            规模：中型（3-6 周）· 技术栈：Vue 3 + Rust + PostgreSQL<br>
            流程：standard_pipeline（6 阶段）
          </div>
          <div class="team">
            <div class="team-badge"><div class="dot" style="background:#7b1fa2;"></div> Assistant</div>
            <div class="team-badge"><div class="dot" style="background:#388e3c;"></div> Tech Lead</div>
            <div class="team-badge" style="opacity:.5;"><div class="dot" style="background:#e65100;"></div> 后端开发 ×1 (待分配)</div>
            <div class="team-badge" style="opacity:.5;"><div class="dot" style="background:#1565c0;"></div> 前端开发 ×1 (待分配)</div>
            <div class="team-badge" style="opacity:.5;"><div class="dot" style="background:#b71c1c;"></div> 测试 ×1 (待分配)</div>
          </div>
        </div>
      </div>
    </div>`;
  addMsg('html', html);
  addMsg('system', '── 项目 "博客系统" 已创建 ──');
}

function addNewConv() {
  // 在会话列表中添加新项目
  const items = document.querySelector('.conv-items');
  const newConv = document.createElement('div');
  newConv.className = 'ci';
  newConv.style.animation = 'fadeIn .3s ease';
  newConv.innerHTML = `
    <div class="ci-av" style="background:#43a047;border-radius:6px;font-size:10px;">新</div>
    <div class="ci-info">
      <div class="ci-name">博客系统 <span style="font-size:9px;color:#43a047;">● 新</span></div>
      <div class="ci-pre">TL: 你好，我是 Tech Lead...</div>
    </div>`;
  // 插入到"项目"标签后面
  const projectLabel = items.querySelectorAll('.conv-lbl')[1];
  projectLabel.after(newConv);
}
</script>
</body>
</html>

use serde::{Deserialize, Serialize};

#[derive(Debug, Serialize, Deserialize, FromRow)]
pub struct Tag {

use axum::{Json, extract::State};
use crate::models::tag::{Tag, CreateTag};
use crate::db::Pool;

pub async fn list_tags(State(pool): State<Pool>) -> Json<Vec<Tag>> {
    let tags = sqlx::query_as::<_, Tag>("SELECT * FROM tags ORDER BY name")

// --- Filter ---
let currentTypeFilter = 'all';

function filterArtifacts(type, el) {
  currentTypeFilter = type;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderArtifactList();
}

// --- Render List ---
function renderArtifactList() {
  const container = document.getElementById('artifactList');
  const items = currentTypeFilter === 'all'
    ? MOCK.artifacts
    : MOCK.artifacts.filter(a => a.type === currentTypeFilter);

  container.innerHTML = items.map(art => `
    <div class="artifact-item ${art.id === selectedArtifact ? 'active' : ''}" onclick="selectArtifact('${art.id}')">
      <span class="art-icon">${art.icon}</span>
      <div class="art-info">
        <div class="art-name">${art.name}</div>
        <div class="art-meta">${art.created_by} · ${art.created_at} · ${art.version}</div>
      </div>
    </div>
  `).join('');
}

// --- Select & Preview ---
let selectedArtifact = null;

function selectArtifact(artId) {
  selectedArtifact = artId;
  renderArtifactList();

  const art = MOCK.artifacts.find(a => a.id === artId);
  const content = ARTIFACT_CONTENT[artId];
  if (!art || !content) return;

  // Update header
  document.getElementById('previewHeader').querySelector('.title').textContent = content.title;
  document.getElementById('previewHeader').querySelector('.subtitle').textContent = `${art.type} · ${art.created_by} · ${art.created_at}`;

  // Render preview
  const preview = document.getElementById('previewArea');
  if (content.type === 'markdown') {
    // Simple markdown-like rendering
    const html = content.content
      .replace(/^### (.+)$/gm, '<h4 style="margin:16px 0 8px;font-size:14px;">$1</h4>')
      .replace(/^## (.+)$/gm, '<h3 style="margin:20px 0 10px;font-size:16px;border-bottom:1px solid #eee;padding-bottom:6px;">$1</h3>')
      .replace(/^# (.+)$/gm, '<h2 style="margin:24px 0 12px;font-size:20px;">$1</h2>')
      .replace(/\| (.+)/g, (match) => `<div style="font-family:var(--font-mono);font-size:12px;color:#666;padding:2px 0;">${match}</div>`)
      .replace(/^- \[[ x]\] (.+)$/gm, (m, text) => {
        const checked = m.includes('[x]');
        return `<div style="padding:2px 0;font-size:13px;"><input type="checkbox" ${checked ? 'checked' : ''} disabled> ${text}</div>`;
      })
      .replace(/^- (.+)$/gm, '<div style="padding:2px 0 2px 16px;font-size:13px;">• $1</div>')
      .replace(/\n\n/g, '<br><br>')
      .replace(/`([^`]+)`/g, '<code style="background:#f0f0f0;padding:1px 4px;border-radius:3px;font-size:12px;">$1</code>');
    preview.innerHTML = `<div style="max-width:720px;line-height:1.7;font-size:14px;">${html}</div>`;
  } else if (content.type === 'code') {
    preview.innerHTML = `<pre style="background:#1e1e1e;color:#d4d4d4;padding:20px;border-radius:8px;font-family:var(--font-mono);font-size:12px;line-height:1.6;overflow:auto;white-space:pre-wrap;">${escapeHtml(content.content)}</pre>`;
  } else if (content.type === 'test') {
    preview.innerHTML = `<pre style="background:#1a1a2e;color:#e0e0e0;padding:20px;border-radius:8px;font-family:var(--font-mono);font-size:12px;line-height:1.8;overflow:auto;white-space:pre-wrap;">${content.content.replace(/✅/g, '<span style="color:#43a047;">✅</span>')}</pre>`;
  }

  // Render versions
  const versionList = document.getElementById('versionList');
  versionList.innerHTML = content.versions.map((v, i) => `
    <div style="padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;${i === 0 ? 'background:var(--color-primary-light);color:var(--color-primary);font-weight:500;' : 'background:#f5f5f5;color:#666;'}">
      ${v.version} · ${v.date}
    </div>
  `).join('');
}

function escapeHtml(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function downloadArtifact() {
  alert('下载功能在实际应用中会触发文件下载');
}

// --- Init ---
document.addEventListener('DOMContentLoaded', () => {
  renderArtifactList();
});
</script>
